<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Event Creator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .event-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center mb-4">
        <h2>📊 Create a Custom Event</h2>
        <p class="text-muted">
            Define and manage custom events by adding event names, keys, and properties.
            This will help track user interactions and behaviors effectively.
        </p>
    </div>

    <div class="event-box">
        <h5 class="mb-3">Event Details</h5>

        <!-- Event Name Input -->
        <div class="mb-3">
            <label for="eventName" class="form-label">Event Name</label>
            <input type="text" id="eventName" class="form-control" placeholder="Enter event name (e.g., Button Click)">
        </div>

        <!-- Dynamic Key-Value Fields -->
        <h6>Event Properties</h6>
        <div id="propertiesContainer">
            <div class="row mb-2">
                <div class="col-md-5">
                    <input type="text" class="form-control" placeholder="Key (e.g., user_id)">
                </div>
                <div class="col-md-5">
                    <input type="text" class="form-control" placeholder="Value (e.g., 12345)">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-danger remove-property">❌</button>
                </div>
            </div>
        </div>

        <button id="addProperty" class="btn btn-outline-primary btn-sm mt-2">➕ Add Property</button>
        
        <div class="mt-4 text-end">
            <button class="btn btn-success">✅ Save Event</button>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        // Add new property input fields
        $('#addProperty').click(function () {
            $('#propertiesContainer').append(`
                <div class="row mb-2">
                    <div class="col-md-5">
                        <input type="text" class="form-control" placeholder="Key (e.g., user_id)">
                    </div>
                    <div class="col-md-5">
                        <input type="text" class="form-control" placeholder="Value (e.g., 12345)">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-danger remove-property">❌</button>
                    </div>
                </div>
            `);
        });

        // Remove a property row
        $(document).on('click', '.remove-property', function () {
            $(this).closest('.row').remove();
        });
    });
</script>

</body>
</html>
